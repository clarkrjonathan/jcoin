[package]
name = "jcoin"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "node"
path = "src/bin/node.rs"

[[bin]]
name = "wallet"
path = "src/bin/wallet.rs"
required-features = ["wallet"]

[[bin]]
name = "relay"
path = "src/bin/relay.rs"

[features]
# `wallet` pulls in reqwest (and thus a TLS stack). It is on by default so a
# plain `cargo build` builds everything; build the relay lean and static with
# `cargo build --release --no-default-features --bin relay` (no reqwest/OpenSSL).
default = ["wallet"]
wallet = ["dep:reqwest"]

[dependencies]
# Web + async runtime
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = { version = "0.4", features = ["serde"] }

# HTTP client (wallet only; optional so the relay/node build without a TLS stack)
reqwest = { version = "0.12", features = ["json"], optional = true }

# Crypto
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# 256-bit integers for cumulative chain work (and, later, difficulty math)
primitive-types = "0.12"

# CLI (wallet)
clap = { version = "4", features = ["derive"] }
