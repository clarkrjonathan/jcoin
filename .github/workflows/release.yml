name: release

# Build the JeffyCoin binaries for Linux and Windows from one tagged commit, with
# SHA-256 checksums, so every node (and every friend) runs an identical, verified
# build (ADR 0002). Triggered by pushing a version tag, or manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            ext: ""
          - os: windows-latest
            label: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The node, wallet, and relay live in the jcoin/ package. The GPU miner is
      # a separate package so the node never depends on GPU libraries.
      - name: Build node, wallet, relay
        run: cargo build --release --manifest-path jcoin/Cargo.toml --bin node --bin wallet --bin relay

      - name: Build GPU miner
        run: cargo build --release --manifest-path gpu-miner/Cargo.toml --bin gpu-miner

      - name: Stage binaries and checksums
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          for b in node wallet relay; do
            cp "jcoin/target/release/${b}${{ matrix.ext }}" "dist/jcoin-${b}-${{ matrix.label }}${{ matrix.ext }}"
          done
          cp "gpu-miner/target/release/gpu-miner${{ matrix.ext }}" "dist/jcoin-gpu-miner-${{ matrix.label }}${{ matrix.ext }}"
          cd dist
          sha256sum * > "SHA256SUMS-${{ matrix.label }}.txt"
          echo "=== checksums (${{ matrix.label }}) ==="
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jcoin-${{ matrix.label }}
          path: dist/*

      # On a tag, attach the binaries and checksums to the GitHub Release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
