name: release

# Build the JeffyCoin binaries for Linux and Windows from one tagged commit, with
# SHA-256 checksums, so every node (and every friend) runs an identical, verified
# build (ADR 0002). Runs only for a version tag (`v*`) whose commit is on `main`:
# a tag on any other branch fails the `check` job and builds nothing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to attach binaries to a GitHub Release

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to test whether the tag is on main

      - name: Tagged commit must be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge to main, then tag the main commit."
            exit 1
          fi

      # The desktop app offers updates by comparing its own version with the
      # release tags, so the two must agree.
      - name: Tag must match the app version
        run: |
          version="$(grep -m1 '^version = ' app/Cargo.toml | cut -d'"' -f2)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/Cargo.toml version $version."
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            ext: ""
          - os: windows-latest
            label: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    # Sentry debug-file upload for the desktop app. The upload step is skipped
    # when SENTRY_AUTH_TOKEN is not set, so the release still builds without it.
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: iowa-state-pe
      SENTRY_PROJECT: jcoin-app
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The node, wallet, and relay live in the jcoin/ package. The GPU miner is
      # a separate package so the node never depends on GPU libraries.
      - name: Build node, wallet, relay
        run: cargo build --release --manifest-path jcoin/Cargo.toml --bin node --bin wallet --bin relay

      - name: Build GPU miner
        run: cargo build --release --manifest-path gpu-miner/Cargo.toml --bin gpu-miner

      # The desktop app (node + wallet + GPU miner in one window) is a third
      # package, so the command-line tools do not depend on GUI libraries.
      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Build desktop app
        run: cargo build --release --manifest-path app/Cargo.toml --bin jcoin-app

      # Upload the desktop app's debug info and source files to Sentry so
      # production panics symbolicate to real functions, files, and lines.
      # Runs before the binary is stripped. Skipped if the secret is absent.
      - name: Upload jcoin-app debug files to Sentry
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        shell: bash
        run: |
          npm install -g @sentry/cli
          sentry-cli debug-files upload --include-sources app/target/release

      - name: Stage binaries and checksums
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          for b in node wallet relay; do
            cp "jcoin/target/release/${b}${{ matrix.ext }}" "dist/jcoin-${b}-${{ matrix.label }}${{ matrix.ext }}"
          done
          cp "gpu-miner/target/release/gpu-miner${{ matrix.ext }}" "dist/jcoin-gpu-miner-${{ matrix.label }}${{ matrix.ext }}"
          cp "app/target/release/jcoin-app${{ matrix.ext }}" "dist/JeffyCoin-${{ matrix.label }}${{ matrix.ext }}"
          # The app keeps debug info for Sentry; strip the shipped Linux binary
          # now that its debug files are uploaded. The Windows .exe holds no
          # debug info (it lives in a separate .pdb), so nothing to strip there.
          if [ "${{ runner.os }}" = "Linux" ]; then
            strip "dist/JeffyCoin-${{ matrix.label }}"
          fi
          cd dist
          sha256sum * > "SHA256SUMS-${{ matrix.label }}.txt"
          echo "=== checksums (${{ matrix.label }}) ==="
          cat "SHA256SUMS-${{ matrix.label }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jcoin-${{ matrix.label }}
          path: dist/*

      # Attach the binaries and checksums to the GitHub Release.
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
