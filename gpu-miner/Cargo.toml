[package]
name = "jcoin-gpu-miner"
version = "0.1.0"
edition = "2021"
description = "JeffyCoin GPU miner: SHA-256 proof of work on any GPU through wgpu (Vulkan, DirectX 12, Metal)"

# A separate package so the node does not depend on GPU libraries. It talks to
# a node only through the REST endpoints GET /mining/work and POST
# /mining/submit (see docs/gpu-miner.md).

[lib]
name = "jcoin_gpu_miner"
path = "src/lib.rs"

[[bin]]
name = "gpu-miner"
path = "src/main.rs"

[dependencies]
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
rand = "0.8"

[profile.release]
debug = false
